<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: "Helvetica Neue", Helvetica, "Segoe UI", Roboto, Arial, system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
    a { color: #7cc4e0; text-decoration: none; }
    a:hover { color: #a8dbef; }
  </style>
</helmet>

<div style="position: relative; width: 390px; height: 844px; background: #0b0d0f; overflow: hidden;">

  <!-- The live parallax hero, as it renders today -->
  <img src="hero.jpg" alt="" style="position: absolute; top: 0; left: 0; width: 390px; height: 844px; object-fit: cover;" />

  <!-- Legibility scrim: the photo's sky is bright at the top and the canopy
       dark at the bottom, so the page furniture needs its own ground. -->
  <div style="position: absolute; inset: 0; background: linear-gradient(rgba(11,13,15,0) 55%, rgba(11,13,15,0.72) 78%, #0b0d0f 100%);"></div>

  <!-- Persistent contact affordance. A recruiter must never have to scroll
       to find a way to reach him. -->
  <div style="position: absolute; top: 0; left: 0; right: 0; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 18px;">
    <div style="font-size: 12px; font-weight: 650; letter-spacing: 0.14em; color: #0d2630; text-transform: uppercase;">JW</div>
    <a href="#" style="display: flex; align-items: center; justify-content: center; min-height: 44px; padding: 0 16px; border: 1px solid rgba(13,38,48,0.35); border-radius: 2px; background: rgba(255,255,255,0.5); color: #0d2630; font-size: 13px; font-weight: 650; letter-spacing: 0.01em;">Résumé</a>
  </div>

  <!-- Name block, matching the live type: 650 weight, -0.025em, dark ink on
       the bright sky. -->
  <div style="position: absolute; top: 112px; left: 0; right: 0; padding: 0 22px; text-align: center;">
    <h1 style="margin: 0; font-size: 44px; font-weight: 650; line-height: 1.02; letter-spacing: -0.025em; color: #0d2630; text-shadow: 0 1px 0 rgba(255,255,255,0.35), 0 18px 44px rgba(10,45,60,0.16);">Jonathan Wong</h1>
    <p style="margin: 12px 0 0; font-size: 13px; font-weight: 500; line-height: 1.35; letter-spacing: 0.02em; color: #0d2630; opacity: 0.88; text-shadow: 0 1px 0 rgba(255,255,255,0.45);">Program Manager — Cybersecurity, Azure,<br />Automation, Retail Tech</p>
  </div>

  <!-- The 60-second answer, above the fold: who he has done it for, and for
       how long. Currently the visitor must scroll two screens to learn this. -->
  <div style="position: absolute; left: 0; right: 0; bottom: 108px; padding: 0 22px;">
    <div style="display: flex; align-items: center; gap: 10px; margin-bottom: 14px;">
      <div style="height: 1px; flex-grow: 1; background: rgba(231,237,240,0.18);"></div>
      <div style="font-size: 10px; font-weight: 650; letter-spacing: 0.18em; color: rgba(231,237,240,0.5); text-transform: uppercase;">12+ years</div>
      <div style="height: 1px; flex-grow: 1; background: rgba(231,237,240,0.18);"></div>
    </div>
    <div style="display: flex; align-items: center; justify-content: center; gap: 22px;">
      <div style="font-size: 15px; font-weight: 650; letter-spacing: -0.01em; color: #e7edf0;">Microsoft</div>
      <div style="font-size: 15px; font-weight: 650; letter-spacing: -0.01em; color: rgba(231,237,240,0.7);">Amazon</div>
      <div style="font-size: 15px; font-weight: 650; letter-spacing: -0.01em; color: rgba(231,237,240,0.7);">Starbucks</div>
    </div>
  </div>

  <!-- Scroll cue, matching the live one -->
  <div style="position: absolute; left: 50%; bottom: 34px; width: 1px; height: 46px; margin-left: -0.5px; background: linear-gradient(180deg, rgba(231,237,240,0) 0%, rgba(231,237,240,0.7) 100%);"></div>

</div>
</x-dc>
</body>
</html>
