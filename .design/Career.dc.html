<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: "Helvetica Neue", Helvetica, "Segoe UI", Roboto, Arial, system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
    a { color: #7cc4e0; text-decoration: none; }
    a:hover { color: #a8dbef; }
    .fill { color: #7cc4e0; background: rgba(124,196,224,0.10); border: 1px dashed rgba(124,196,224,0.45); border-radius: 2px; padding: 0 5px; }
  </style>
</helmet>

<!-- What the zoom parallax should land on. Today it ends on a flat colour
     field: the animation pays off with no information. Ending on the role
     card turns the effect into the delivery mechanism for the content. -->
<div style="position: relative; width: 390px; height: 844px; background: #2f6f8f; overflow: hidden;">

  <div style="position: absolute; inset: 0; background: linear-gradient(rgba(11,13,15,0) 30%, rgba(11,13,15,0.55) 62%, rgba(11,13,15,0.93) 100%);"></div>

  <div style="position: absolute; left: 0; right: 0; bottom: 0; padding: 0 22px 40px; display: flex; flex-direction: column; gap: 20px;">

    <div style="display: flex; flex-direction: column; gap: 7px;">
      <div style="font-size: 10px; font-weight: 650; letter-spacing: 0.18em; color: rgba(255,255,255,0.65); text-transform: uppercase;">Currently</div>
      <div style="font-size: 34px; font-weight: 650; letter-spacing: -0.025em; line-height: 1.05; color: #fff;">Microsoft</div>
      <div style="font-size: 14px; font-weight: 500; line-height: 1.35; color: rgba(255,255,255,0.86);">Program Manager, Cybersecurity · <span class="fill" style="color:#cfeaf6;">2021</span>–Present</div>
    </div>

    <div style="height: 1px; background: rgba(255,255,255,0.18);"></div>

    <!-- The rest of the timeline, readable without replaying the animation.
         A recruiter who scrolls past the zoom should still get the history. -->
    <div style="display: flex; flex-direction: column; gap: 11px;">
      <div style="display: flex; align-items: baseline; gap: 12px;">
        <div style="width: 8px; height: 8px; border-radius: 50%; background: #6f76b5; flex-shrink: 0;"></div>
        <div style="flex-grow: 1; font-size: 13px; font-weight: 650; color: rgba(255,255,255,0.92);">Microsoft — Azure</div>
        <div style="font-size: 11px; color: rgba(255,255,255,0.55);"><span class="fill" style="color:#cfeaf6;">years</span></div>
      </div>
      <div style="display: flex; align-items: baseline; gap: 12px;">
        <div style="width: 8px; height: 8px; border-radius: 50%; background: #5b9b73; flex-shrink: 0;"></div>
        <div style="flex-grow: 1; font-size: 13px; font-weight: 650; color: rgba(255,255,255,0.92);">Amazon — Program Manager</div>
        <div style="font-size: 11px; color: rgba(255,255,255,0.55);"><span class="fill" style="color:#cfeaf6;">years</span></div>
      </div>
      <div style="display: flex; align-items: baseline; gap: 12px;">
        <div style="width: 8px; height: 8px; border-radius: 50%; background: #a8697f; flex-shrink: 0;"></div>
        <div style="flex-grow: 1; font-size: 13px; font-weight: 650; color: rgba(255,255,255,0.92);">Starbucks — Retail Technology</div>
        <div style="font-size: 11px; color: rgba(255,255,255,0.55);"><span class="fill" style="color:#cfeaf6;">years</span></div>
      </div>
      <div style="display: flex; align-items: baseline; gap: 12px;">
        <div style="width: 8px; height: 8px; border-radius: 50%; background: rgba(255,255,255,0.35); flex-shrink: 0;"></div>
        <div style="flex-grow: 1; font-size: 13px; font-weight: 650; color: rgba(255,255,255,0.6);"><span class="fill" style="color:#cfeaf6;">Earlier roles</span></div>
        <div style="font-size: 11px; color: rgba(255,255,255,0.55);"><span class="fill" style="color:#cfeaf6;">years</span></div>
      </div>
    </div>

  </div>

</div>
</x-dc>
</body>
</html>
