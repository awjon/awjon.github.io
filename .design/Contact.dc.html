<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: "Helvetica Neue", Helvetica, "Segoe UI", Roboto, Arial, system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
    a { color: #7cc4e0; text-decoration: none; }
    a:hover { color: #a8dbef; }
    .fill { color: #7cc4e0; background: rgba(124,196,224,0.10); border: 1px dashed rgba(124,196,224,0.45); border-radius: 2px; padding: 0 5px; }
  </style>
</helmet>

<div style="width: 390px; height: 844px; background: #0b0d0f; padding: 44px 22px 34px; display: flex; flex-direction: column; gap: 28px;">

  <!-- Capabilities, grouped by the four areas in his own headline. -->
  <div style="display: flex; flex-direction: column; gap: 16px;">
    <div style="font-size: 10px; font-weight: 650; letter-spacing: 0.18em; color: rgba(231,237,240,0.45); text-transform: uppercase;">What I run</div>

    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px;">
      <div style="padding: 14px 13px; background: #101418; border-radius: 2px; display: flex; flex-direction: column; gap: 6px;">
        <div style="font-size: 13px; font-weight: 650; color: #e7edf0;">Cybersecurity</div>
        <div style="font-size: 11px; line-height: 1.4; color: rgba(231,237,240,0.55);"><span class="fill">3–4 tools</span></div>
      </div>
      <div style="padding: 14px 13px; background: #101418; border-radius: 2px; display: flex; flex-direction: column; gap: 6px;">
        <div style="font-size: 13px; font-weight: 650; color: #e7edf0;">Azure</div>
        <div style="font-size: 11px; line-height: 1.4; color: rgba(231,237,240,0.55);"><span class="fill">3–4 tools</span></div>
      </div>
      <div style="padding: 14px 13px; background: #101418; border-radius: 2px; display: flex; flex-direction: column; gap: 6px;">
        <div style="font-size: 13px; font-weight: 650; color: #e7edf0;">Automation</div>
        <div style="font-size: 11px; line-height: 1.4; color: rgba(231,237,240,0.55);"><span class="fill">3–4 tools</span></div>
      </div>
      <div style="padding: 14px 13px; background: #101418; border-radius: 2px; display: flex; flex-direction: column; gap: 6px;">
        <div style="font-size: 13px; font-weight: 650; color: #e7edf0;">Retail Tech</div>
        <div style="font-size: 11px; line-height: 1.4; color: rgba(231,237,240,0.55);"><span class="fill">3–4 tools</span></div>
      </div>
    </div>
  </div>

  <div style="height: 1px; background: rgba(231,237,240,0.10);"></div>

  <!-- The close. One primary action, with the secondary routes beneath it. -->
  <div style="display: flex; flex-direction: column; gap: 18px;">
    <p style="margin: 0; font-size: 27px; font-weight: 600; line-height: 1.15; letter-spacing: -0.02em; color: #e7edf0; text-wrap: pretty;">Hiring for a program that needs order?</p>

    <a href="#" style="display: flex; align-items: center; justify-content: center; min-height: 52px; background: #2f6f8f; color: #fff; border-radius: 2px; font-size: 15px; font-weight: 650; letter-spacing: 0.01em;">Get in touch</a>

    <div style="display: flex; flex-direction: column; gap: 2px;">
      <a href="#" style="display: flex; align-items: center; gap: 11px; min-height: 48px; border-bottom: 1px solid rgba(231,237,240,0.08);">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="4" width="20" height="16" rx="2"></rect><path d="m2 7 10 6 10-6"></path></svg>
        <span style="flex-grow: 1; font-size: 14px; font-weight: 500; color: #e7edf0;">Email</span>
        <span style="font-size: 12px;" class="fill">you@domain.com</span>
      </a>
      <a href="#" style="display: flex; align-items: center; gap: 11px; min-height: 48px; border-bottom: 1px solid rgba(231,237,240,0.08);">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="9" width="4" height="12"></rect><circle cx="4" cy="4" r="2"></circle><path d="M10 21V9m0 5a5 5 0 0 1 10 0v7"></path></svg>
        <span style="flex-grow: 1; font-size: 14px; font-weight: 500; color: #e7edf0;">LinkedIn</span>
        <span style="font-size: 12px;" class="fill">/in/handle</span>
      </a>
      <a href="#" style="display: flex; align-items: center; gap: 11px; min-height: 48px; border-bottom: 1px solid rgba(231,237,240,0.08);">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><path d="M14 2v6h6M9 15h6"></path></svg>
        <span style="flex-grow: 1; font-size: 14px; font-weight: 500; color: #e7edf0;">Résumé</span>
        <span style="font-size: 12px;" class="fill">PDF link</span>
      </a>
    </div>
  </div>

  <div style="margin-top: auto; font-size: 11px; color: rgba(231,237,240,0.35);">Seattle, WA</div>

</div>
</x-dc>
