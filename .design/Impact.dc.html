<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: "Helvetica Neue", Helvetica, "Segoe UI", Roboto, Arial, system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
    a { color: #7cc4e0; text-decoration: none; }
    a:hover { color: #a8dbef; }
    .fill { color: #7cc4e0; background: rgba(124,196,224,0.10); border: 1px dashed rgba(124,196,224,0.45); border-radius: 2px; padding: 0 5px; }
  </style>
</helmet>

<div style="width: 390px; height: 844px; background: #0b0d0f; padding: 40px 22px; display: flex; flex-direction: column; gap: 26px;">

  <div style="display: flex; flex-direction: column; gap: 12px;">
    <div style="font-size: 10px; font-weight: 650; letter-spacing: 0.18em; color: rgba(231,237,240,0.45); text-transform: uppercase;">Selected impact</div>
    <p style="margin: 0; font-size: 25px; font-weight: 600; line-height: 1.18; letter-spacing: -0.02em; color: #e7edf0; text-wrap: pretty;">12+ years turning ambiguous problems into time tested systems.</p>
  </div>

  <!-- Three proof points. The figures and outcome lines are placeholders:
       these are the numbers a recruiter scans for, and they have to be his. -->
  <div style="display: flex; flex-direction: column; gap: 14px;">

    <div style="display: flex; gap: 16px; align-items: flex-start; padding: 18px 16px; background: #101418; border-left: 2px solid #2f6f8f; border-radius: 2px;">
      <div style="min-width: 62px; font-size: 30px; font-weight: 650; letter-spacing: -0.03em; line-height: 1; color: #2f6f8f;"><span class="fill">00</span></div>
      <div style="display: flex; flex-direction: column; gap: 5px;">
        <div style="font-size: 14px; font-weight: 650; line-height: 1.3; color: #e7edf0;"><span class="fill">The outcome, in one line</span></div>
        <div style="font-size: 12px; font-weight: 400; line-height: 1.4; color: rgba(231,237,240,0.6);">Microsoft · Cybersecurity</div>
      </div>
    </div>

    <div style="display: flex; gap: 16px; align-items: flex-start; padding: 18px 16px; background: #101418; border-left: 2px solid #4a4f7a; border-radius: 2px;">
      <div style="min-width: 62px; font-size: 30px; font-weight: 650; letter-spacing: -0.03em; line-height: 1; color: #6f76b5;"><span class="fill">00</span></div>
      <div style="display: flex; flex-direction: column; gap: 5px;">
        <div style="font-size: 14px; font-weight: 650; line-height: 1.3; color: #e7edf0;"><span class="fill">The outcome, in one line</span></div>
        <div style="font-size: 12px; font-weight: 400; line-height: 1.4; color: rgba(231,237,240,0.6);">Microsoft · Azure</div>
      </div>
    </div>

    <div style="display: flex; gap: 16px; align-items: flex-start; padding: 18px 16px; background: #101418; border-left: 2px solid #3f6b4f; border-radius: 2px;">
      <div style="min-width: 62px; font-size: 30px; font-weight: 650; letter-spacing: -0.03em; line-height: 1; color: #5b9b73;"><span class="fill">00</span></div>
      <div style="display: flex; flex-direction: column; gap: 5px;">
        <div style="font-size: 14px; font-weight: 650; line-height: 1.3; color: #e7edf0;"><span class="fill">The outcome, in one line</span></div>
        <div style="font-size: 12px; font-weight: 400; line-height: 1.4; color: rgba(231,237,240,0.6);">Amazon · Program Management</div>
      </div>
    </div>

  </div>

  <div style="display: flex; align-items: center; gap: 9px; margin-top: auto;">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="rgba(124,196,224,0.8)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <circle cx="12" cy="12" r="9"></circle>
      <path d="M12 8h.01M11 12h1v4h1"></path>
    </svg>
    <div style="font-size: 11px; line-height: 1.4; color: rgba(231,237,240,0.5);">Dashed fields are yours to fill — no figures invented.</div>
  </div>

</div>
</x-dc>
</body>
</html>
